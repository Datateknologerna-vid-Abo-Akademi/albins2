name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    concurrency:
      group: docker-publish-${{ github.ref_name }}-${{ matrix.service }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref_type == 'branch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: backend
            dockerfile: backend/Dockerfile.prod
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login with retry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "GHCR login failed after 3 attempts."
          exit 1

      - name: Compute image tags
        id: tags
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}-${{ matrix.service }}
        run: |
          set -euo pipefail

          TAGS=("${IMAGE_REPO}:${GITHUB_SHA}")

          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS+=("${IMAGE_REPO}:qa")
          fi

          {
            echo "value<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    concurrency:
      group: docker-publish-${{ github.ref_name }}-${{ matrix.service }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
          - service: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Docker login with retry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "GHCR login failed after 3 attempts."
          exit 1

      - name: Promote the existing image to release tags
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}-${{ matrix.service }}
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a SemVer release tag, skipping."
            exit 0
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"

          SOURCE_TAG="${IMAGE_REPO}:${GITHUB_SHA}"

          # The release tag is created after the main build starts; wait for
          # the SHA-tagged image, then reuse that digest instead of rebuilding.
          for attempt in $(seq 1 24); do
            if docker buildx imagetools inspect "${SOURCE_TAG}" >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 24 ]; then
              echo "Timed out waiting for ${SOURCE_TAG} to exist."
              exit 1
            fi
            sleep 10
          done

          docker buildx imagetools create \
            --tag "${IMAGE_REPO}:${GITHUB_REF_NAME}" \
            --tag "${IMAGE_REPO}:v${MAJOR}.${MINOR}" \
            --tag "${IMAGE_REPO}:v${MAJOR}" \
            --tag "${IMAGE_REPO}:prod" \
            --tag "${IMAGE_REPO}:latest" \
            "${SOURCE_TAG}"
